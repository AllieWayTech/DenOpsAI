[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "denops-ai-builder"
version = "0.1.0"
description = "Minimal fail-closed control plane for the DenOps AI builder"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
denops-ai-builder = "denops_ai_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

